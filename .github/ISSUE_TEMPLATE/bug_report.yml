name: Bug report
description: Something in the app, the transaction engine, or a WebMCP tool behaves incorrectly.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. If this is a security issue, please use
        [private reporting](https://github.com/Iltwats/stateTrace/security/advisories/new)
        instead — see `SECURITY.md`.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you expect, and what did you observe instead?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: The UI actions and/or tool calls in order.
      placeholder: |
        1. Open the checkout demo
        2. Ask the agent to update the shipping address
        3. Open Activity and inspect the result
        4. ...
    validations:
      required: true

  - type: dropdown
    id: surface
    attributes:
      label: Where did you hit it?
      options:
        - Human UI only
        - WebMCP tool call
        - Both
        - Tests or build
    validations:
      required: true

  - type: input
    id: host
    attributes:
      label: Browser / WebMCP host
      placeholder: "Browser and version, plus the agent host if applicable"

  - type: input
    id: version
    attributes:
      label: Commit or version
      placeholder: "main @ 77d8eb2"

  - type: textarea
    id: fixture
    attributes:
      label: Regression fixture (optional but ideal)
      description: >
        If possible, ask the agent to call save_regression_fixture and paste the
        returned fixture details here so the trace can be replayed.
      render: json
