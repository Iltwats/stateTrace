name: Bug report
description: Something in the app, the transaction engine, or a WebMCP tool behaves incorrectly.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. If this is a security issue, please use
        [private reporting](https://github.com/Iltwats/stateTrace/security/advisories/new)
        instead — see `SECURITY.md`.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you expect, and what did you observe instead?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: The UI actions and/or tool calls in order.
      placeholder: |
        1. Select "Fail next"
        2. Stage the agent address change
        3. ...
    validations:
      required: true

  - type: dropdown
    id: surface
    attributes:
      label: Where did you hit it?
      options:
        - Human UI only
        - WebMCP tool call
        - Both
        - Tests or build
    validations:
      required: true

  - type: input
    id: host
    attributes:
      label: Browser / WebMCP host
      placeholder: "Chrome 149 with #enable-webmcp-testing, or ChatGPT desktop app 1.x"

  - type: input
    id: version
    attributes:
      label: Commit or version
      placeholder: "main @ 77d8eb2"

  - type: textarea
    id: fixture
    attributes:
      label: Regression fixture (optional but ideal)
      description: >
        Use the app's "Save regression fixture" control and paste the JSON here.
        It makes the trace deterministically replayable.
      render: json
